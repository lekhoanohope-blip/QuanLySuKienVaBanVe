name: Build WinForms

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release / .NET Framework 4.7.2
    runs-on: windows-2022
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Restore NuGet packages
        run: |
          nuget restore QuanLySuKienVaBanVe.sln -PackagesDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive
          nuget restore UnitTests/packages.config -PackagesDirectory UnitTests/packages -Source https://api.nuget.org/v3/index.json -NonInteractive

      - name: Build Release
        run: >-
          msbuild QuanLySuKienVaBanVe.sln
          /m
          /t:Rebuild
          /p:Configuration=Release
          '/p:Platform=Any CPU'
          /verbosity:minimal
          /nologo

      - name: Run Unit Tests
        run: dotnet test UnitTests/bin/Release/QuanLySuKienVaBanVe.UnitTests.dll --verbosity normal

      - name: Include Database Scripts in Release
        run: |
          if (Test-Path database) {
            Copy-Item -Recurse -Force database bin/Release/database
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuanLySuKienVaBanVe-Release
          path: bin/Release/
          if-no-files-found: error
          retention-days: 30
